      <script>
      (function () {
        'use strict';
        var root = document.querySelector('[data-section-id="pg054_sec002"]');
        if (!root || root.dataset.notesReady) return;
        root.dataset.notesReady = 'true';
        root.addEventListener('focusin', function (event) {
          var target = event.target;
          if (!target.matches('textarea, summary, button, a')) return;
          requestAnimationFrame(function () {
            var dock = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-height')) || 80;
            var rect = target.getBoundingClientRect();
            if (rect.bottom > window.innerHeight - dock - 12) {
              window.scrollBy(0, rect.bottom - (window.innerHeight - dock - 12));
            }
          });
        });
        root.querySelectorAll('textarea[data-activity-item]').forEach(function (field) {
          var key = 'shoqeria-dhe-mjedisi-4:pg054_sec002:' + field.dataset.activityItem;
          var group = field.closest('li');
          var feedback = group.querySelector('[role="status"]');
          var retry = group.querySelector('[data-action="retry-save"]');
          try {
            var stored = localStorage.getItem(key);
            if (stored !== null) field.value = stored;
          } catch (error) {
            feedback.textContent = '! Ruajtja nuk është e disponueshme.';
            retry.hidden = false;
          }
          function save() {
            try {
              localStorage.setItem(key, field.value);
              if (localStorage.getItem(key) !== field.value) throw new Error('save');
              feedback.textContent = '✓ U ruajt.';
              retry.hidden = true;
            } catch (error) {
              feedback.textContent = '! Ruajtja dështoi. Shënimi mbetet këtu; provoni përsëri.';
              retry.hidden = false;
            }
          }
          field.addEventListener('input', save);
          retry.addEventListener('click', save);
        });
      }());
      </script>
