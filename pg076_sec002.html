<script>
(function () {
  var fields = document.querySelectorAll('#content textarea[data-activity-item]');
  fields.forEach(function (field) {
    var details = field.closest('details'), status = details.querySelector('[role=status]'), retry = details.querySelector('[data-action=retry-save]');
    var key = 'Shoqeria-dhe-Mjedisi-4:pg076_sec002:' + field.dataset.activityItem;
    try { var value = localStorage.getItem(key); if (value !== null) { field.value = value; if (value) details.open = true; } } catch (e) { status.hidden = false; status.textContent = '⚠ Nuk u ruajt.'; retry.hidden = false; }

      try { localStorage.setItem(key, field.value); if (localStorage.getItem(key) !== field.value) throw new Error('save'); status.textContent = '✓ U ruajt.'; status.hidden = false; retry.hidden = true; }
      catch (e) { status.textContent = '⚠ Nuk u ruajt.'; status.hidden = false; retry.hidden = false; }
    }
    field.addEventListener('input', save); retry.addEventListener('click', save);
  });
}());
