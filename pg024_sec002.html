<body>
<main>
<div id="content" data-book-theme="empathy" data-reading-layout="text" class="bk" data-family="lesson-discussion">
<h1 class="bk-title bk-sr-only" id="page-heading">Ndihem i/e barabartë</h1>
<section class="bk-stack" data-section-id="pg024_sec002" data-source-section-type="activity_open_ended_answer" aria-labelledby="page-heading">
<section class="bk-activity bk-card bk-card--surface1" data-activity-pattern="extended-response" data-activity-variant="one-question">
<label class="bk-prompt bk-label" for="activity-item-1"><span class="bk-label" aria-hidden="true">? </span><span id="pg024_n0017" data-id="pg024_n0017">Vazhdoni tregimin me surpriza të këndshme.</span></label>
<p class="bk-caption" id="pg024-story-help">Përgjigje opsionale. Ruhet automatikisht në këtë pajisje.</p>
<textarea class="bk-field" id="activity-item-1" data-activity-item="item-1" aria-label="Vazhdoni tregimin me surpriza të këndshme." aria-describedby="pg024-story-help" rows="4"></textarea>
<p class="bk-feedback" role="status" aria-live="polite"></p>
<button class="bk-btn bk-btn--secondary" type="button" data-action="retry-save" hidden>Provo ruajtjen përsëri</button>
</section>
</section>
</div>
</main>
<script>window.activityAnswerTextIds=JSON.parse('{}');</script>
<div id="interface-container"></div>
<div id="nav-container"></div>
<script src="./assets/offline-preloader.js"></script>
<script src="./assets/scorm.js"></script>
<script src="./assets/base.bundle.local.js"></script>
<script>
/* Original unkeyed open responses are private drafts, not submitted answers.
   Both parts use the original source activity and item identity. */
(function(){
const prefix='shoqeria-dhe-mjedisi-4:pg024_sec002:';
function read(store,key){try{const record=JSON.parse(window[store].getItem(key));return record&&typeof record.value==='string'?record:null;}catch(e){return null;}}
document.querySelectorAll('#content textarea[data-activity-item]').forEach(function(field){
const key=prefix+field.dataset.activityItem,group=field.closest('.bk-activity'),status=group.querySelector('[role="status"]'),retry=group.querySelector('[data-action="retry-save"]');
const local=read('localStorage',key),backup=read('sessionStorage',key),saved=backup&&(!local||backup.time>local.time)?backup:local;
let draft=saved||{value:field.value,time:0};
if(saved){field.value=saved.value;status.textContent=local&&local.time>=saved.time?'✓ U ruajt.':'! Nuk u ruajt. Shënimi është ruajtur përkohësisht në këtë sesion.';retry.hidden=!!(local&&local.time>=saved.time);}
function save(){
draft={value:field.value,time:Date.now()};
try{sessionStorage.setItem(key,JSON.stringify(draft));}catch(e){}
try{localStorage.setItem(key,JSON.stringify(draft));status.textContent='✓ U ruajt.';retry.hidden=true;}catch(e){status.textContent='! Nuk u ruajt. Mbajeni këtë faqe hapur dhe provoni përsëri.';retry.hidden=false;}
}
field.addEventListener('input',save);field.addEventListener('change',save);retry.addEventListener('click',save);
window.addEventListener('pagehide',function(){if(field.value!==draft.value)save();});
});
})();
</script>
