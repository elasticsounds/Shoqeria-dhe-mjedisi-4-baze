        </div>
        <p class="bk-feedback" role="status" aria-live="polite" id="pg070-save-status"></p>
        <div><button class="bk-btn bk-btn--secondary" type="button" id="pg070-retry" hidden>Provo ruajtjen përsëri</button></div>
      </section>
    </div>
    <script>
      (function () {
        var root = document.querySelector('[data-section-id="pg070_sec001"]');
        if (!root || root.dataset.saveReady) return;
        root.dataset.saveReady = 'true';
        var fields = Array.prototype.slice.call(root.querySelectorAll('textarea[data-activity-item]'));
        var status = document.getElementById('pg070-save-status');
        var retry = document.getElementById('pg070-retry');
        var prefix = 'ShoqeriaDheMjedisi4:pg070_sec001:';
        var loaded = false, dirty = {};
        function key(field) { return prefix + field.dataset.activityItem; }
        function save() {
          if (!loaded) { retry.hidden = false; status.textContent = '⚠ Nuk u lexuan përgjigjet e ruajtura. Provo përsëri.'; return; }
          try {
            fields.forEach(function (field) { localStorage.setItem(key(field), field.value); });
            dirty = {}; retry.hidden = true; status.textContent = '✓ U ruajt.';
          } catch (e) {
            retry.hidden = false;
            status.textContent = '⚠ Nuk u ruajt. Përgjigjet mbeten në këtë faqe; provo përsëri.';
          }
        }
        function load(isRetry) {
          try {
            var values = fields.map(function (field) { return localStorage.getItem(key(field)); });
            fields.forEach(function (field, i) { if (!dirty[field.id] && values[i] !== null) field.value = values[i]; });
            loaded = true; retry.hidden = true;
            if (Object.keys(dirty).length) save();
            else if (isRetry) status.textContent = '✓ Përgjigjet u ngarkuan.';
          } catch (e) {
            loaded = false; retry.hidden = false; status.textContent = '⚠ Nuk u lexuan përgjigjet e ruajtura. Provo përsëri.';
          }
        }
        load(false);
        fields.forEach(function (field) { field.addEventListener('input', function () { dirty[field.id] = true; save(); }); });
        retry.addEventListener('click', function () { if (loaded) save(); else load(true); });
      }());
    </script>
  </section>
