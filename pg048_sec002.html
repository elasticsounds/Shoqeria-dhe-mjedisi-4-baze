<script>
window.activityAnswerTextIds = JSON.parse('{}');
(function () {
  var book = new URL('.', location.href).pathname;
  document.querySelectorAll('#content textarea[data-activity-item]').forEach(function (field) {
    var box = field.closest('.bk-activity');
    var status = box.querySelector('[role=status]');
    var retry = box.querySelector('[data-action=retry-save]');
    var key = 'adt-notes:' + book + ':pg048_sec002:' + field.dataset.activityItem;
    var timer, readFailed = false, dirty = false;
    function show(message, failed) { status.hidden = false; status.textContent = message; retry.hidden = !failed; }
    function save() {
      clearTimeout(timer);
      if (readFailed) { show('⚠ Ruajtja nuk mund të lexohet. Shënimi mbetet në fushë; provoni përsëri.', true); return; }
      try {
        localStorage.setItem(key, field.value);
        retry.hidden = true;
        timer = setTimeout(function () { show('✓ U ruajt.', false); }, 400);
      } catch (e) { show('⚠ Nuk u ruajt. Shënimi mbetet në fushë.', true); }
    }
    function load() {
      try {
        var saved = localStorage.getItem(key);
        if (dirty && saved !== null) {
          readFailed = true;
          show('⚠ Ka një shënim të mëparshëm. Kopjoni shënimin aktual para se të ringarkoni faqen.', true);
          return;
        }
        readFailed = false;
        if (!dirty && saved !== null) field.value = saved;
        status.hidden = true; retry.hidden = true;
        if (dirty) save();
      } catch (e) { readFailed = true; show('⚠ Shënimi nuk mund të lexohet nga ruajtja.', true); }
    }
    load();
    field.addEventListener('input', function () { dirty = true; save(); });
    retry.addEventListener('click', function () { if (readFailed) load(); else save(); });
  });
}());
</script>
