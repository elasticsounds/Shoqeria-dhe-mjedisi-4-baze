<script>
(function(){
 if(window.pg084Notes){window.pg084Notes.mount();return;}
 var prefix='ShoqeriaDheMjedisi4:pg084_sec002:';
 function fields(){return document.querySelectorAll('#content [data-section-id^="pg084_sec002"] textarea[data-activity-item]');}
 function status(field,ok){var box=field.closest('.bk-activity'),msg=box.querySelector('.bk-feedback'),retry=box.querySelector('[data-action="retry-save"]');msg.textContent=ok?'✓ U ruajt.':'! Nuk u ruajt.';retry.hidden=ok;}
 function save(field){try{var k=prefix+field.dataset.activityItem;localStorage.setItem(k,field.value);if(localStorage.getItem(k)!==field.value)throw Error('save');status(field,true);}catch(e){status(field,false);}}
 function mount(){fields().forEach(function(field){if(field.dataset.pg084Ready)return;field.dataset.pg084Ready='true';try{var value=localStorage.getItem(prefix+field.dataset.activityItem);if(value!==null)field.value=value;}catch(e){status(field,false);}});}
 document.addEventListener('input',function(e){if(e.target.matches('#content [data-section-id^="pg084_sec002"] textarea[data-activity-item]'))save(e.target);});
 document.addEventListener('click',function(e){var retry=e.target.closest('#content [data-section-id^="pg084_sec002"] [data-action="retry-save"]');if(retry)save(retry.closest('.bk-activity').querySelector('textarea'));});
 document.addEventListener('adt:page-changed',mount);new MutationObserver(mount).observe(document.body,{childList:true,subtree:true});window.pg084Notes={mount:mount};mount();
})();
</script>
