      <div data-family="lesson-discussion" id="content" data-book-theme="rights" data-reading-layout="text" class="bk">
        <section role="region" aria-labelledby="pg018_n0025" data-section-type="discussion" data-section-id="pg018_sec003" class="bk-card bk-card--surface1 bk-activity" data-activity-pattern="discussion" data-activity-variant="paired-dialogue">

          <details id="pg018-notes">
            <summary class="bk-btn bk-btn--secondary">Shënime (opsionale)</summary>
            <div class="bk-stack">
              <label for="activity-item-1" class="bk-sr-only">Bëni një dialog në dyshe, ku njëri ka rolin e mjekut, kurse tjetri rolin e pacientit.</label>
              <textarea id="activity-item-1" data-activity-item="item-1" aria-label="Bëni një dialog në dyshe, ku njëri ka rolin e mjekut, kurse tjetri rolin e pacientit." aria-describedby="pg018-note-help" class="bk-field" rows="3"></textarea>
              <p id="pg018-note-help" class="bk-caption">Shënime për përgatitje. Ruhen vetëm në këtë shfletues.</p>
              <p id="pg018-save-status" class="bk-feedback" role="status" aria-live="polite" aria-atomic="true" hidden></p>
              <button class="bk-btn bk-btn--secondary" type="button" data-action="retry-save" hidden>Provo ruajtjen përsëri</button>
            </div>
          </details>
        </section>

    </main>
    <script type="text/javascript">window.activityAnswerTextIds = JSON.parse('{}');</script>
    <script>
    (() => {
      const field = document.getElementById('activity-item-1');
      const status = document.getElementById('pg018-save-status');
      const retry = document.querySelector('[data-action="retry-save"]');
      const key = 'adt:shoqeria-dhe-mjedisi-4:pg018_sec003:item-1:notes:v1';
      // Do not migrate bare item-1 / activity-item-1 keys: they occur on other pages.
      let dirty = false;
      function announce(text, failed) {
        status.hidden = false;
        status.textContent = text;
        retry.hidden = !failed;
        status.style.borderColor = failed ? 'var(--bk-warning)' : 'var(--bk-success)';
      }
      try {
        const saved = localStorage.getItem(key);
        if (saved !== null) {
          const record = JSON.parse(saved);
          if (record.section === 'pg018_sec003' && record.item === 'item-1' && typeof record.text === 'string') field.value = record.text;
        }
      } catch (_) { announce('⚠ Nuk u lexuan shënimet e ruajtura. Provo përsëri.', true); }
      function save() {
        if (!dirty) return;
        try {
          const record = JSON.stringify({section:'pg018_sec003',item:'item-1',text:field.value});
          localStorage.setItem(key, record);
          if (localStorage.getItem(key) !== record) throw new Error('save');
          dirty = false;
          announce('✓ U ruajt.', false);
        } catch (_) { announce('⚠ Nuk u ruajt. Shënimet mbeten në fushë.', true); }
      }
      field.addEventListener('input', () => { dirty = true; save(); });
      field.addEventListener('change', () => { dirty = true; save(); });
      field.addEventListener('blur', save);
      retry.addEventListener('click', () => {
        if (!dirty) {
          try {
            const saved = localStorage.getItem(key);
            if (saved !== null && !field.value) {
              const record = JSON.parse(saved);
              if (record.section === 'pg018_sec003' && record.item === 'item-1' && typeof record.text === 'string') field.value = record.text;
            }
          } catch (_) { announce('⚠ Nuk u lexuan shënimet e ruajtura. Provo përsëri.', true);return; }
        }
        dirty = true;save();
      });
      window.addEventListener('pagehide', save);
      document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
    })();
    </script>
    <div class="relative z-50" id="interface-container"></div>
    <div class="relative z-50" id="nav-container"></div>
