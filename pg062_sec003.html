    <script>
      // The localization runtime can replace the contents of the bound span.
      // Restore the source's emphasis without changing its text or its binding.
      (() => {
        const bound = document.querySelector('[data-id="pg062_n0032"]');
        const prefix = 'Fjalët kyçe:';
        function emphasizePrefix() {
          if (bound.firstElementChild?.classList.contains('bk-label')) return;
          const text = bound.textContent;
          if (!text.startsWith(prefix)) return;
          const label = document.createElement('span');
          label.className = 'bk-label';
          label.textContent = prefix;
          bound.replaceChildren(label, document.createTextNode(text.slice(prefix.length)));
        }
        new MutationObserver(emphasizePrefix).observe(bound, { childList: true, subtree: true, characterData: true });
        emphasizePrefix();
      })();
    </script>
