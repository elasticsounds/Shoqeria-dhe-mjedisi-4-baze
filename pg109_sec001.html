<script>
(function () {
  'use strict';
  var key = 'ShoqeriaDheMjedisi4:pg109_sec001:itinerary:v1';
  var fields = Array.from(document.querySelectorAll('#content [data-activity-item]'));
  var status = document.getElementById('pg109-save-status');
  var retry = document.querySelector('#content [data-action="retry-save"]');
  try {
    var saved = JSON.parse(localStorage.getItem(key) || '{}');
    fields.forEach(function (field) {
      if (Object.prototype.hasOwnProperty.call(saved, field.dataset.activityItem) && typeof saved[field.dataset.activityItem] === 'string') field.value = saved[field.dataset.activityItem];
    });
  } catch (error) {
    status.textContent = '! Nuk u ruajt.';
    retry.hidden = false;
  }
  function save() {
    var values = {};
    fields.forEach(function (field) { values[field.dataset.activityItem] = field.value; });
    try {
      localStorage.setItem(key, JSON.stringify(values));
      status.textContent = '✓ U ruajt.';
      retry.hidden = true;
    } catch (error) {
      status.textContent = '! Nuk u ruajt.';
      retry.hidden = false;
    }
  }
  fields.forEach(function (field) {
    field.addEventListener('input', save);
    field.addEventListener('focus', function () {
      requestAnimationFrame(function () {
        var bottom = field.getBoundingClientRect().bottom;
        var limit = window.innerHeight - 120;
        if (bottom > limit) window.scrollBy(0, bottom - limit);
      });
    });
  });
  retry.addEventListener('click', save);
})();
</script>
