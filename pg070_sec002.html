<script>
(() => {
  const unsaved = new Set();
  window.addEventListener('beforeunload', e => {
    if (unsaved.size) { e.preventDefault(); e.returnValue = ''; }
  });
  document.querySelectorAll('#content details').forEach(details => {
    const field = details.querySelector('[data-activity-item]');
    const status = details.querySelector('[role="status"]');
    const retry = details.querySelector('[data-action="retry-save"]');
    const key = 'ShoqeriaDheMjedisi4:pg070_sec002:' + field.dataset.activityItem;
    const backupKey = key + ':draft';
    let backup = null;
    try { backup = sessionStorage.getItem(backupKey); } catch (e) {}
    try {
      const saved = localStorage.getItem(key);
      if (backup !== null) {
        field.value = backup; unsaved.add(key); retry.hidden = false;
        status.hidden = false; status.textContent = '⚠ U rikthye një shënim i paruajtur. Provo ruajtjen përsëri.';
      } else if (saved !== null) field.value = saved;
    } catch (e) {
      if (backup !== null) { field.value = backup; unsaved.add(key); retry.hidden = false; }
      status.hidden = false; status.textContent = '⚠ Nuk u lexuan shënimet e ruajtura.';
    }
    function save() {
      try { sessionStorage.setItem(backupKey, field.value); } catch (e) {}
      try {
        localStorage.setItem(key, field.value); unsaved.delete(key);
        try { sessionStorage.removeItem(backupKey); } catch (e) {}
        status.textContent = '✓ U ruajt.'; status.hidden = false; retry.hidden = true;
      } catch (e) {
        unsaved.add(key); status.textContent = '⚠ Nuk u ruajt. Provo përsëri para se të largohesh.'; status.hidden = false; retry.hidden = false;
      }
    }
    field.addEventListener('input', save);
    retry.addEventListener('click', save);
  });
})();
</script>
